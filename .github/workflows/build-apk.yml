name: Build SAHAY APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found!"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Found Gradle wrapper at: $GRADLEW"
          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAHAY-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
